# job to essentially run `npm outdated --long` and report the results to a GitHub issue. This is useful for keeping track of dependencies that are out of date and need to be updated.
on:
  schedule:     
    - cron: '0 0 * * 0' # every Sunday at midnight
  workflow_dispatch:
name: Check Dependencies
permissions:            
  contents: write
  issues: write
  checks: write
  statuses: read
  pull-requests: write
jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache node modules
        uses: actions/cache@v5
        with: 
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - name: Check for outdated dependencies
        run: npm ci
      - name: Report outdated dependencies
        id: outdated
        shell: bash
        run: |
          set +e
          npm outdated --long > outdated.txt 2>&1
          exit_code=$?
          if [ "$exit_code" -gt 1 ]; then
            echo "npm outdated failed with exit code $exit_code"
            cat outdated.txt
            exit "$exit_code"
          fi
          if [ -s outdated.txt ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update dependency issue
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const title = 'Outdated dependencies';
            const marker = '<!-- dependency-report -->';
            const report = fs.readFileSync('outdated.txt', 'utf8').trim();
            const hasUpdates = '${{ steps.outdated.outputs.has_updates }}' === 'true';
            const body = hasUpdates
              ? `${marker}\n## Outdated dependencies\n\n\`\`\`text\n${report}\n\`\`\`\n\nGenerated by the weekly dependency check.`
              : `${marker}\nAll npm dependencies are up to date.\n\nGenerated by the weekly dependency check.`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const issue = issues.find((candidate) => candidate.title === title);

            if (hasUpdates) {
              if (issue) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body,
                  state: 'open'
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['dependencies']
                });
              }
            } else if (issue && issue.state === 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
                state: 'closed'
              });
            }
